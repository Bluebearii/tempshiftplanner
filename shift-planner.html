<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shift Planner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
  :root{
    --ink:#1c2430;
    --ink-soft:#5b6472;
    --paper:#f5f3ee;
    --card:#ffffff;
    --line:#e4e0d6;
    --accent:#c96f4a;
    --accent-soft:#f1e0d5;
    --good:#3f7a5c;
    --radius:10px;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1400px;margin:0 auto;padding:28px 24px 60px;}

  /* header */
  .topbar{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px;flex-wrap:wrap;margin-bottom:22px;
    border-bottom:2px solid var(--ink);
    padding-bottom:16px;
  }
  .brand h1{
    margin:0;font-size:26px;letter-spacing:-0.02em;font-weight:800;
  }
  .brand .sub{color:var(--ink-soft);font-size:13px;margin-top:2px;font-family:var(--mono);}
  .week-nav{display:flex;align-items:center;gap:10px;}
  .week-nav button{
    width:32px;height:32px;border-radius:50%;border:1.5px solid var(--ink);
    background:var(--card);cursor:pointer;font-size:15px;font-weight:700;
    display:flex;align-items:center;justify-content:center;color:var(--ink);
    transition:background .15s;
  }
  .week-nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent);}
  .week-label{font-family:var(--mono);font-size:14px;min-width:190px;text-align:center;font-weight:600;}
  .today-btn{
    font-family:var(--mono);font-size:12px;border:1.5px solid var(--ink-soft);
    background:transparent;border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--ink-soft);
  }
  .today-btn:hover{border-color:var(--ink);color:var(--ink);}
  .export-btn{
    background:var(--ink);color:#fff;border:none;border-radius:20px;
    padding:10px 20px;font-size:13px;font-weight:700;cursor:pointer;
    letter-spacing:.02em;display:flex;align-items:center;gap:8px;
  }
  .export-btn:hover{background:var(--accent);}
  .export-btn:disabled{opacity:.5;cursor:default;}

  /* layout */
  .layout{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;
  }
  .panel-title{
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;
    color:var(--ink-soft);font-weight:700;margin:0 0 12px;
  }

  /* employee list */
  .emp-row{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;
    cursor:pointer;border:1px solid transparent;
  }
  .emp-row:hover{background:#faf8f4;border-color:var(--line);}
  .emp-row.active{background:var(--accent-soft);border-color:var(--accent);}
  .swatch{width:13px;height:13px;border-radius:4px;flex:none;}
  .emp-name{font-weight:600;font-size:14px;flex:1;}
  .emp-hours{font-family:var(--mono);font-size:11px;color:var(--ink-soft);}

  .add-emp-btn{
    width:100%;margin-top:10px;padding:10px;border-radius:8px;border:1.5px dashed var(--ink-soft);
    background:transparent;color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;
  }
  .add-emp-btn:hover{border-color:var(--accent);color:var(--accent);}

  /* form */
  .form-field{margin-bottom:12px;}
  .form-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;}
  .form-field input[type=text], .form-field input[type=number], .form-field select{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:var(--sans);background:#fdfcfa;
  }
  .form-field input:focus, .form-field select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}

  .days-table{border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .day-line{
    display:grid;grid-template-columns:26px 60px 1fr;gap:8px;align-items:center;
    padding:7px 9px;border-bottom:1px solid var(--line);background:#fff;
  }
  .day-line:last-child{border-bottom:none;}
  .day-line.checked{background:#faf8f4;}
  .day-line input[type=checkbox]{width:15px;height:15px;cursor:pointer;}
  .day-line .dname{font-size:12.5px;font-weight:600;font-family:var(--mono);}
  .day-line select, .day-line input[type=text]{
    padding:5px 7px;font-size:12px;border:1px solid var(--line);border-radius:5px;background:#fdfcfa;width:100%;
  }
  .day-line select:disabled, .day-line input:disabled{opacity:.4;background:#f1efe9;}

  .color-pick{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
  .color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .color-dot.sel{border-color:var(--ink);}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .btn{padding:8px 14px;border-radius:7px;border:1px solid var(--ink);font-size:13px;font-weight:600;cursor:pointer;}
  .btn-primary{background:var(--ink);color:#fff;}
  .btn-primary:hover{background:var(--accent);border-color:var(--accent);}
  .btn-ghost{background:transparent;color:var(--ink-soft);border-color:var(--line);}
  .btn-ghost:hover{color:var(--ink);border-color:var(--ink-soft);}
  .btn-danger{background:transparent;color:#b1352b;border-color:#e3b4ac;font-size:12px;}
  .btn-danger:hover{background:#fbeae7;}

  /* schedule grid */
  .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
  @media (max-width:900px){.week-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.week-grid{grid-template-columns:1fr;}}

  .day-col{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);min-height:220px;display:flex;flex-direction:column;overflow:hidden;}
  .day-head{padding:10px 12px;border-bottom:1px solid var(--line);background:#faf8f4;}
  .day-head.today{background:var(--ink);color:#fff;}
  .day-weekday{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.7;}
  .day-date{font-family:var(--mono);font-size:15px;font-weight:700;}
  .day-body{padding:10px;flex:1;display:flex;flex-direction:column;gap:6px;}
  .shift-chip{
    display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;font-size:12.5px;
    color:#111;font-weight:600;position:relative;
  }
  .shift-chip .t{font-family:var(--mono);font-weight:500;opacity:.85;font-size:11px;margin-left:auto;}
  .shift-chip .rm{
    background:rgba(0,0,0,.18);border:none;color:#111;width:16px;height:16px;border-radius:50%;
    cursor:pointer;font-size:11px;line-height:1;flex:none;
  }
  .shift-chip .rm:hover{background:rgba(0,0,0,.3);}
  .add-shift{
    margin-top:auto;padding:7px;border-radius:7px;border:1.3px dashed var(--line);
    background:transparent;color:var(--ink-soft);font-size:12px;cursor:pointer;font-weight:600;
  }
  .add-shift:hover{border-color:var(--accent);color:var(--accent);}

  .assign-pop{
    position:absolute;background:var(--card);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;z-index:50;min-width:220px;
  }
  .assign-pop .opt{
    display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;
  }
  .assign-pop .opt:hover{background:var(--accent-soft);}
  .assign-pop select, .assign-pop input[type=text]{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;margin-top:6px;}
  .assign-pop .go{margin-top:6px;width:100%;padding:6px;border-radius:6px;border:none;background:var(--ink);color:#fff;font-size:12px;cursor:pointer;font-weight:700;}
  .assign-pop label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:700;display:block;margin-top:6px;}

  .empty-note{color:var(--ink-soft);font-size:13px;text-align:center;padding:20px 6px;}
  .overlay{position:fixed;inset:0;z-index:40;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <h1>Shift Planner</h1>
      <div class="sub" id="empCount">0 team members</div>
    </div>
    <div class="week-nav">
      <button id="prevWeek">‹</button>
      <div class="week-label" id="weekLabel">—</div>
      <button id="nextWeek">›</button>
      <button class="today-btn" id="todayBtn">Now</button>
    </div>
    <button class="export-btn" id="exportBtn">⬇ Export to Excel</button>
  </div>

  <div class="layout">
    <div class="card" id="sidebar">
      <div class="panel-title">Team</div>
      <div id="empList"></div>
      <button class="add-emp-btn" id="addEmpBtn">+ Add team member</button>
    </div>

    <div>
      <div class="week-grid" id="weekGrid"></div>
    </div>
  </div>
</div>

<script>
const PALETTE = [
  '#FFF14C','#7CE07C','#5BB8C4','#F79A4A','#F04FD1','#C79ADB',
  '#F5A6B8','#8FE0E8','#B9E06A','#F2E0A6','#D9A6E0','#A6C6F2'
];
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const TIME_PRESETS = [
  '9:00am–5:00pm','11:30am–4:30pm','12:30pm–4:30pm','4:30pm–9:00pm',
  '5:30pm–9:00pm','6:00pm–9:00pm','8:00am–2:00pm','2:00pm–8:00pm','Custom…'
];

let employees = [];      // {id,name,color,preferredDays:[{day,time}],availability,hoursNeeded}
let schedule = {};        // { 'YYYY-MM-DD': [{employeeId, time}] }
let editingEmpId = null;
let currentWeekStart = mondayOf(new Date());

function uid(){ return 'e' + Math.random().toString(36).slice(2,10); }

function mondayOf(d){
  const dt = new Date(d);
  const day = dt.getDay();
  const diff = (day === 0 ? -6 : 1) - day;
  dt.setDate(dt.getDate() + diff);
  dt.setHours(0,0,0,0);
  return dt;
}
function fmtISO(d){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function sameDay(a,b){ return fmtISO(a) === fmtISO(b); }

function nextColor(){
  const used = employees.map(e=>e.color);
  for(const c of PALETTE) if(!used.includes(c)) return c;
  return PALETTE[employees.length % PALETTE.length];
}

/* ---------- persistence ---------- */
async function loadState(){
  try{
    const r = await window.storage.get('employees');
    employees = r ? JSON.parse(r.value) : [];
  }catch(e){ employees = []; }
  try{
    const r = await window.storage.get('schedule');
    schedule = r ? JSON.parse(r.value) : {};
  }catch(e){ schedule = {}; }
}
async function saveEmployees(){
  try{ await window.storage.set('employees', JSON.stringify(employees)); }catch(e){ console.error('save employees failed', e); }
}
async function saveSchedule(){
  try{ await window.storage.set('schedule', JSON.stringify(schedule)); }catch(e){ console.error('save schedule failed', e); }
}

/* ---------- render: sidebar ---------- */
function renderSidebar(){
  const list = document.getElementById('empList');
  document.getElementById('empCount').textContent = employees.length + ' team member' + (employees.length===1?'':'s');
  if(employees.length === 0){
    list.innerHTML = '<div class="empty-note">No team members yet.<br>Add your first below.</div>';
    return;
  }
  list.innerHTML = '';
  employees.forEach(emp=>{
    const row = document.createElement('div');
    row.className = 'emp-row' + (editingEmpId===emp.id ? ' active':'');
    row.innerHTML = `
      <div class="swatch" style="background:${emp.color}"></div>
      <div class="emp-name">${escapeHtml(emp.name)}</div>
      <div class="emp-hours">${emp.hoursNeeded ? emp.hoursNeeded+'h/wk' : ''}</div>
    `;
    row.onclick = ()=> openEmployeeForm(emp.id);
    list.appendChild(row);
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- employee form ---------- */
function openEmployeeForm(empId){
  editingEmpId = empId || null;
  const emp = empId ? employees.find(e=>e.id===empId) : {name:'',color:nextColor(),preferredDays:[],availability:'',hoursNeeded:''};
  const sidebar = document.getElementById('sidebar');
  const prefMap = {};
  (emp.preferredDays||[]).forEach(pd=> prefMap[pd.day] = pd.time);

  const wrap = document.createElement('div');
  wrap.style.marginTop = '16px';
  wrap.style.borderTop = '1px solid var(--line)';
  wrap.style.paddingTop = '14px';
  wrap.innerHTML = `
    <div class="form-field">
      <label>Name</label>
      <input type="text" id="f-name" value="${escapeHtml(emp.name)}" placeholder="e.g. Jordan Lee">
    </div>
    <div class="form-field">
      <label>Preferred days &amp; times</label>
      <div class="days-table" id="f-days">
        ${DAY_NAMES.map((d,i)=>{
          const checked = prefMap.hasOwnProperty(i);
          const savedTime = prefMap[i] || '';
          const isPreset = TIME_PRESETS.includes(savedTime);
          return `
          <div class="day-line ${checked?'checked':''}" data-day="${i}">
            <input type="checkbox" class="day-chk" ${checked?'checked':''}>
            <div class="dname">${d}</div>
            <div style="display:flex;gap:5px;">
              <select class="day-time-select" ${checked?'':'disabled'} style="flex:1">
                ${TIME_PRESETS.map(p=>`<option value="${p}" ${ (isPreset && p===savedTime) || (!isPreset && p==='Custom…' && savedTime) ?'selected':''}>${p}</option>`).join('')}
              </select>
              <input type="text" class="day-time-custom" placeholder="e.g. 11:30am-4:30pm" value="${!isPreset?escapeHtml(savedTime):''}"
                style="flex:1;display:${(!isPreset)?'block':'none'}" ${checked?'':'disabled'}>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    <div class="form-field">
      <label>General availability notes</label>
      <input type="text" id="f-avail" value="${escapeHtml(emp.availability)}" placeholder="e.g. No mornings, can cover call-outs">
    </div>
    <div class="form-field">
      <label>Hours needed / week</label>
      <input type="number" id="f-hours" value="${emp.hoursNeeded}" min="0" placeholder="e.g. 25">
    </div>
    <div class="form-field">
      <label>Color</label>
      <div class="color-pick" id="f-colors">
        ${PALETTE.map(c=>`<div class="color-dot ${c===emp.color?'sel':''}" style="background:${c}" data-color="${c}"></div>`).join('')}
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" id="f-save">${empId?'Save changes':'Add member'}</button>
      <button class="btn btn-ghost" id="f-cancel">Cancel</button>
      ${empId?'<button class="btn btn-danger" id="f-delete" style="margin-left:auto">Remove</button>':''}
    </div>
  `;

  const old = document.getElementById('emp-form-wrap');
  if(old) old.remove();
  wrap.id = 'emp-form-wrap';
  sidebar.appendChild(wrap);

  let pickedColor = emp.color;

  // wire up each day line
  wrap.querySelectorAll('.day-line').forEach(line=>{
    const chk = line.querySelector('.day-chk');
    const sel = line.querySelector('.day-time-select');
    const custom = line.querySelector('.day-time-custom');
    const syncCustomVisibility = ()=>{
      custom.style.display = sel.value === 'Custom…' ? 'block' : 'none';
    };
    syncCustomVisibility();
    chk.onchange = ()=>{
      const on = chk.checked;
      line.classList.toggle('checked', on);
      sel.disabled = !on;
      custom.disabled = !on;
    };
    sel.onchange = syncCustomVisibility;
  });

  wrap.querySelectorAll('.color-dot').forEach(dot=>{
    dot.onclick = ()=>{
      pickedColor = dot.dataset.color;
      wrap.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('sel'));
      dot.classList.add('sel');
    };
  });

  document.getElementById('f-cancel').onclick = ()=>{ editingEmpId=null; wrap.remove(); renderSidebar(); };

  document.getElementById('f-save').onclick = async ()=>{
    const name = document.getElementById('f-name').value.trim();
    if(!name){ alert('Please enter a name.'); return; }
    const hoursVal = document.getElementById('f-hours').value;

    const preferredDays = [];
    wrap.querySelectorAll('.day-line').forEach(line=>{
      const chk = line.querySelector('.day-chk');
      if(!chk.checked) return;
      const sel = line.querySelector('.day-time-select');
      const custom = line.querySelector('.day-time-custom');
      const time = sel.value === 'Custom…' ? custom.value.trim() : sel.value;
      preferredDays.push({ day: Number(line.dataset.day), time });
    });

    const data = {
      name,
      color: pickedColor,
      preferredDays,
      availability: document.getElementById('f-avail').value.trim(),
      hoursNeeded: hoursVal ? Number(hoursVal) : 0
    };
    if(empId){
      Object.assign(emp, data);
    } else {
      employees.push({ id: uid(), ...data });
    }
    await saveEmployees();
    editingEmpId = null;
    wrap.remove();
    renderSidebar();
    renderWeek();
  };

  if(empId){
    document.getElementById('f-delete').onclick = async ()=>{
      if(!confirm(`Remove ${emp.name}? This also clears their assigned shifts.`)) return;
      employees = employees.filter(e=>e.id!==empId);
      Object.keys(schedule).forEach(date=>{
        schedule[date] = schedule[date].filter(s=>s.employeeId!==empId);
        if(schedule[date].length===0) delete schedule[date];
      });
      await saveEmployees();
      await saveSchedule();
      editingEmpId = null;
      wrap.remove();
      renderSidebar();
      renderWeek();
    };
  }
}

document.getElementById('addEmpBtn').onclick = ()=> openEmployeeForm(null);

/* ---------- week grid ---------- */
function getWeekDates(){
  const arr = [];
  for(let i=0;i<7;i++){
    const d = new Date(currentWeekStart);
    d.setDate(d.getDate()+i);
    arr.push(d);
  }
  return arr;
}

function renderWeekLabel(){
  const dates = getWeekDates();
  const first = dates[0], last = dates[6];
  const label = `${MONTHS[first.getMonth()]} ${first.getDate()} – ${MONTHS[last.getMonth()]} ${last.getDate()}, ${last.getFullYear()}`;
  document.getElementById('weekLabel').textContent = label;
}

function renderWeek(){
  renderWeekLabel();
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  const today = new Date();
  getWeekDates().forEach(date=>{
    const iso = fmtISO(date);
    const isToday = sameDay(date, today);
    const col = document.createElement('div');
    col.className = 'day-col';
    const shifts = schedule[iso] || [];
    col.innerHTML = `
      <div class="day-head ${isToday?'today':''}">
        <div class="day-weekday">${DAY_LONG[date.getDay()]}</div>
        <div class="day-date">${MONTHS[date.getMonth()]} ${date.getDate()}</div>
      </div>
      <div class="day-body" id="body-${iso}"></div>
    `;
    grid.appendChild(col);
    const body = col.querySelector('.day-body');

    if(shifts.length===0 && employees.length>0){
      const note = document.createElement('div');
      note.className = 'empty-note';
      note.style.padding = '6px 0 0';
      note.textContent = 'No one scheduled';
      body.appendChild(note);
    }

    shifts.forEach(s=>{
      const emp = employees.find(e=>e.id===s.employeeId);
      if(!emp) return;
      const chip = document.createElement('div');
      chip.className = 'shift-chip';
      chip.style.background = emp.color;
      chip.innerHTML = `<span>${escapeHtml(emp.name)}</span>${s.time?`<span class="t">${escapeHtml(s.time)}</span>`:''}<button class="rm" title="Remove">×</button>`;
      chip.querySelector('.rm').onclick = async ()=>{
        schedule[iso] = schedule[iso].filter(x=>!(x.employeeId===s.employeeId && x.time===s.time));
        if(schedule[iso].length===0) delete schedule[iso];
        await saveSchedule();
        renderWeek();
      };
      body.appendChild(chip);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'add-shift';
    addBtn.textContent = '+ Assign';
    addBtn.onclick = (ev)=> openAssignPopover(ev, iso);
    body.appendChild(addBtn);
    if(employees.length===0){
      addBtn.disabled = true;
      addBtn.style.opacity = .4;
      addBtn.title = 'Add a team member first';
    }
  });
}

function closePopovers(){
  document.querySelectorAll('.assign-pop, .overlay').forEach(el=>el.remove());
}

function openAssignPopover(ev, iso){
  closePopovers();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = closePopovers;
  document.body.appendChild(overlay);

  const rect = ev.target.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'assign-pop';
  pop.style.top = (window.scrollY + rect.bottom + 6) + 'px';
  pop.style.left = (window.scrollX + rect.left) + 'px';

  const weekday = new Date(iso + 'T00:00:00').getDay();
  const already = new Set((schedule[iso]||[]).map(s=>s.employeeId));
  const available = employees.filter(e=>!already.has(e.id));

  if(available.length===0){
    pop.innerHTML = '<div class="empty-note" style="padding:6px;">Everyone is already scheduled this day.</div>';
  } else {
    pop.innerHTML = available.map(e=>`
      <div class="opt" data-id="${e.id}">
        <div class="swatch" style="background:${e.color}"></div>
        <div>${escapeHtml(e.name)}</div>
      </div>
    `).join('') +
      `<label>Shift time</label>` +
      `<input type="text" id="pop-time" placeholder="e.g. 11:30am–4:30pm">` +
      `<button class="go" id="pop-go">Add selected</button>`;
  }
  document.body.appendChild(pop);
  pop.onclick = (e)=> e.stopPropagation();

  let selectedId = null;
  pop.querySelectorAll('.opt').forEach(opt=>{
    opt.onclick = ()=>{
      selectedId = opt.dataset.id;
      pop.querySelectorAll('.opt').forEach(o=>o.style.background='');
      opt.style.background = 'var(--accent-soft)';
      const emp = employees.find(x=>x.id===selectedId);
      const pref = (emp.preferredDays||[]).find(pd=>pd.day===weekday);
      if(pref) document.getElementById('pop-time').value = pref.time;
    };
  });
  const goBtn = pop.querySelector('#pop-go');
  if(goBtn){
    goBtn.onclick = async ()=>{
      if(!selectedId){ alert('Pick a team member first.'); return; }
      const time = document.getElementById('pop-time').value.trim();
      if(!schedule[iso]) schedule[iso] = [];
      schedule[iso].push({ employeeId: selectedId, time });
      await saveSchedule();
      closePopovers();
      renderWeek();
    };
  }
}

/* ---------- navigation ---------- */
document.getElementById('prevWeek').onclick = ()=>{
  currentWeekStart.setDate(currentWeekStart.getDate()-7);
  renderWeek();
};
document.getElementById('nextWeek').onclick = ()=>{
  currentWeekStart.setDate(currentWeekStart.getDate()+7);
  renderWeek();
};
document.getElementById('todayBtn').onclick = ()=>{
  currentWeekStart = mondayOf(new Date());
  renderWeek();
};

/* ---------- excel export (mirrors the day-column layout in-app) ---------- */
document.getElementById('exportBtn').onclick = exportToExcel;

function hexToARGB(hex){
  return 'FF' + hex.replace('#','').toUpperCase();
}

function parseStartMinutes(timeStr){
  if(!timeStr) return 9999;
  const m = timeStr.match(/(\d{1,2})(:(\d{2}))?\s*(am|pm)?/i);
  if(!m) return 9999;
  let h = parseInt(m[1],10);
  const min = m[3] ? parseInt(m[3],10) : 0;
  const ap = (m[4]||'').toLowerCase();
  if(ap === 'pm' && h !== 12) h += 12;
  if(ap === 'am' && h === 12) h = 0;
  return h*60+min;
}

async function exportToExcel(){
  const btn = document.getElementById('exportBtn');
  btn.disabled = true;
  btn.textContent = 'Building workbook…';
  try{
    const wb = new ExcelJS.Workbook();
    wb.creator = 'Shift Planner';
    wb.created = new Date();

    const dates = getWeekDates();
    const dayShifts = dates.map(d=>{
      const iso = fmtISO(d);
      const list = (schedule[iso]||[]).slice();
      list.sort((a,b)=> parseStartMinutes(a.time) - parseStartMinutes(b.time));
      return list;
    });
    const maxRows = Math.max(1, ...dayShifts.map(l=>l.length));

    const sheet = wb.addWorksheet('Schedule', { views:[{state:'frozen', ySplit:3}] });
    sheet.columns = dates.map(()=>({ width:22 }));

    // Row 1: week range title, merged across all 7 columns
    const first = dates[0], last = dates[6];
    const titleText = `${first.getMonth()+1}/${first.getDate()}/${first.getFullYear()}----${last.getMonth()+1}/${last.getDate()}/${last.getFullYear()}`;
    sheet.mergeCells(1,1,1,7);
    const titleCell = sheet.getCell(1,1);
    titleCell.value = titleText;
    titleCell.font = { size:20, bold:true, color:{argb:'FF1C2430'} };
    titleCell.alignment = { vertical:'middle', horizontal:'center' };
    sheet.getRow(1).height = 34;

    // Row 2: weekday names
    dates.forEach((d,i)=>{
      const cell = sheet.getCell(2, i+1);
      cell.value = DAY_LONG[d.getDay()];
      cell.font = { size:14, bold:true, color:{argb:'FF1C2430'} };
      cell.alignment = { vertical:'middle', horizontal:'center' };
      cell.border = { top:{style:'thin',color:{argb:'FFCCCCCC'}}, bottom:{style:'thin',color:{argb:'FFCCCCCC'}}, left:{style:'thin',color:{argb:'FFCCCCCC'}}, right:{style:'thin',color:{argb:'FFCCCCCC'}} };
    });
    sheet.getRow(2).height = 26;

    // Row 3: dates
    dates.forEach((d,i)=>{
      const cell = sheet.getCell(3, i+1);
      cell.value = `${d.getMonth()+1}/${d.getDate()}`;
      cell.font = { size:12, color:{argb:'FF444444'} };
      cell.alignment = { vertical:'middle', horizontal:'center' };
      cell.border = { bottom:{style:'thin',color:{argb:'FFCCCCCC'}}, left:{style:'thin',color:{argb:'FFCCCCCC'}}, right:{style:'thin',color:{argb:'FFCCCCCC'}} };
    });
    sheet.getRow(3).height = 20;

    // Shift rows, stacked per day
    for(let r=0;r<maxRows;r++){
      const rowNum = 4+r;
      dates.forEach((d,i)=>{
        const s = dayShifts[i][r];
        const cell = sheet.getCell(rowNum, i+1);
        cell.border = { top:{style:'thin',color:{argb:'FFDDDDDD'}}, bottom:{style:'thin',color:{argb:'FFDDDDDD'}}, left:{style:'thin',color:{argb:'FFDDDDDD'}}, right:{style:'thin',color:{argb:'FFDDDDDD'}} };
        cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
        if(s){
          const emp = employees.find(e=>e.id===s.employeeId);
          if(emp){
            cell.value = s.time ? `${emp.name}  ${s.time}` : emp.name;
            cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb: hexToARGB(emp.color)} };
            cell.font = { bold:true, size:12, color:{argb:'FF1C1C1C'} };
          }
        }
      });
      sheet.getRow(rowNum).height = 26;
    }

    /* --- Sheet 2: Team --- */
    const team = wb.addWorksheet('Team');
    team.columns = [
      { header:'Name', width:20 },
      { header:'Preferred days & times', width:44 },
      { header:'General availability', width:30 },
      { header:'Hours needed / wk', width:18 }
    ];
    const th = team.getRow(1);
    th.font = { bold:true, color:{argb:'FFFFFFFF'} };
    th.eachCell(c=>{ c.fill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1C2430'} }; });
    th.height = 22;

    employees.forEach(emp=>{
      const prefText = (emp.preferredDays||[])
        .map(pd=> `${DAY_NAMES[pd.day]} ${pd.time||''}`.trim())
        .join(',  ') || '—';
      const row = team.addRow([
        emp.name,
        prefText,
        emp.availability || '—',
        emp.hoursNeeded || ''
      ]);
      row.getCell(1).fill = { type:'pattern', pattern:'solid', fgColor:{argb: hexToARGB(emp.color)} };
      row.getCell(1).font = { bold:true, color:{argb:'FF1C1C1C'} };
      row.eachCell(c=>{
        c.alignment = { vertical:'middle', horizontal: c.col===1?'center':'left', wrapText:true };
        c.border = { top:{style:'thin',color:{argb:'FFE4E0D6'}}, bottom:{style:'thin',color:{argb:'FFE4E0D6'}} };
      });
    });

    const buffer = await wb.xlsx.writeBuffer();
    const blob = new Blob([buffer], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `schedule-${fmtISO(dates[0])}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }catch(e){
    console.error(e);
    alert('Something went wrong building the Excel file.');
  }finally{
    btn.disabled = false;
    btn.textContent = '⬇ Export to Excel';
  }
}

/* ---------- init ---------- */
(async function init(){
  await loadState();
  renderSidebar();
  renderWeek();
})();
</script>
